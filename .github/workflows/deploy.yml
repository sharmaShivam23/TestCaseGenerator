name: CI/CD Pipeline for MERN Stack

on:
  push:
    branches:
      - main

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/testcase-backend
      FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/testcase-frontend
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build & Push Backend Image
      - name: Build & Push Backend Image
        run: |
          docker build -t $BACKEND_IMAGE:latest -t $BACKEND_IMAGE:$IMAGE_TAG ./Backend
          docker push $BACKEND_IMAGE:latest
          docker push $BACKEND_IMAGE:$IMAGE_TAG

      # Step 5: Build & Push Frontend Image
      - name: Build & Push Frontend Image
        run: |
          docker build -t $FRONTEND_IMAGE:latest -t $FRONTEND_IMAGE:$IMAGE_TAG ./Frontend
          docker push $FRONTEND_IMAGE:latest
          docker push $FRONTEND_IMAGE:$IMAGE_TAG

      # Step 6: Deploy to AWS EC2 via SSH
      - name: Deploy on AWS EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pulling latest Docker images..."
            sudo docker pull $BACKEND_IMAGE:$IMAGE_TAG
            sudo docker pull $FRONTEND_IMAGE:$IMAGE_TAG

            echo "Stopping and removing old containers if they exist..."
            sudo docker stop backend frontend || true
            sudo docker rm backend frontend || true

            echo "Running new backend container..."
            sudo docker run -d --name backend -p 5000:5000 \
              --env-file /home/${{ secrets.EC2_USER }}/TestCaseGenerator/Backend/.env \
              $BACKEND_IMAGE:$IMAGE_TAG

            echo "Running new frontend container..."
            sudo docker run -d --name frontend -p 3000:3000 \
              --env-file /home/${{ secrets.EC2_USER }}/TestCaseGenerator/Frontend/.env \
              $FRONTEND_IMAGE:$IMAGE_TAG

            echo "✅ Deployment completed successfully!"
